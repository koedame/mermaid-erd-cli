version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The CodeQL init and analyze steps must run the same version, so they
      # are updated together for every update type, majors included.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      actions-minor-patch:
        update-types:
          - minor
          - patch
